name: CI

on:
  pull_request:
    branches: [ develop ]
    types: [ opened, synchronize, reopened ]

jobs:
  build-and-test:
    runs-on: xcode-27
    defaults:
      run:
        # Runs as `bash -eo pipefail` so xcodebuild failures are not masked by the formatter pipe
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Validate Screen.swift case names
        run: ./Scripts/check_screen_sync.sh

      - name: Set up Xcode 27
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27'

      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Install xcbeautify
        run: command -v xcbeautify || brew install xcbeautify

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Build and test
        run: |
          xcodebuild -workspace MyToybox.xcworkspace -scheme MyToybox \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro' \
            CODE_SIGNING_ALLOWED=NO clean test | xcbeautify
