name: CI

on:
  pull_request:
    branches: [ develop ]
    types: [ opened, synchronize, reopened ]

jobs:
  build-and-test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Validate Screen.swift case names
        run: ./Scripts/check_screen_sync.sh

      - name: Set up Xcode 27
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27'

      - name: Install xcpretty
        run: gem install xcpretty

      - name: List available simulators
        run: xcrun simctl list devices

      - name: Build with xcodebuild
        run: |
          xcodebuild -workspace MyToybox.xcworkspace -scheme MyToybox \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro' \
            CODE_SIGNING_ALLOWED=NO clean build | xcpretty

      - name: Run Xcode tests
        run: |
          xcodebuild -workspace MyToybox.xcworkspace -scheme MyToybox \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro' \
            CODE_SIGNING_ALLOWED=NO test | xcpretty --test
